name: otterOS
options:
  bundleIdPrefix: com.djsly
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.0.3
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: QGMAWHX827
    CODE_SIGN_STYLE: Automatic

targets:
  otterOS:
    type: application
    platform: iOS
    sources:
      - otterOS
    entitlements:
      path: otterOS/otterOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: otterOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: otterOS
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: otterOS records conversations you start so it can transcribe them and pull out action items for your list.
        NSSpeechRecognitionUsageDescription: otterOS transcribes your recordings on this device to build summaries and action items.
        NSHealthShareUsageDescription: otterOS reads your step count to show progress toward your daily 10,000-step goal.
        NSHealthUpdateUsageDescription: otterOS does not write health data today; this permission covers future workout logging.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            tail40af16.ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djsly.otteros
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
